<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="本機持倉總覽">
    <title>持倉總覽</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <script src="/static/dashboard.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/" aria-label="持倉總覽首頁">
          <span class="brand__mark" aria-hidden="true">P</span>
          <span>持倉總覽</span>
        </a>
        <span class="topbar__note">唯讀 · 本機資料</span>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">PORTFOLIO OVERVIEW</p>
          <h1 id="page-title">我的持倉</h1>
          <p id="valuation-time" class="muted">正在取得最新估值…</p>
        </div>
        <div class="dashboard-controls">
          <label class="select-label" for="portfolio-select">投資組合</label>
          <select id="portfolio-select" aria-label="選擇投資組合" disabled></select>
          <button id="refresh-button" class="button" type="button" disabled>
            重新整理
          </button>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="dashboard" class="dashboard" hidden>
        <section class="summary-grid" aria-label="投資組合摘要">
          <article class="metric metric--primary">
            <p>總資產</p>
            <strong id="total-value">—</strong>
            <span id="portfolio-currency" class="metric__detail"></span>
          </article>
          <article class="metric">
            <p>證券市值</p>
            <strong id="securities-value">—</strong>
            <span class="metric__detail">不含現金</span>
          </article>
          <article class="metric">
            <p>現金</p>
            <strong id="cash-value">—</strong>
            <span id="cash-weight" class="metric__detail">—</span>
          </article>
          <article class="metric">
            <p>總損益</p>
            <strong id="total-pnl">—</strong>
            <span id="total-pnl-detail" class="metric__detail">—</span>
          </article>
          <article class="metric">
            <p>已實現損益</p>
            <strong id="realized-pnl">—</strong>
            <span class="metric__detail">已完成交易</span>
          </article>
          <article class="metric">
            <p>未實現損益</p>
            <strong id="unrealized-pnl">—</strong>
            <span class="metric__detail">現有持倉</span>
          </article>
        </section>

        <section class="panel allocation-panel" aria-labelledby="allocation-title">
          <div class="panel__heading">
            <div>
              <p class="eyebrow">ALLOCATION</p>
              <h2 id="allocation-title">資產配置</h2>
            </div>
            <span id="allocation-caption" class="muted"></span>
          </div>
          <div id="allocation-bar" class="allocation-bar" role="img" aria-label="資產配置"></div>
          <ul id="allocation-legend" class="allocation-legend" aria-label="資產配置明細"></ul>
        </section>

        <section id="warnings" class="warnings" aria-label="資料警示" hidden></section>

        <section class="panel positions-panel" aria-labelledby="positions-title">
          <div class="panel__heading">
            <div>
              <p class="eyebrow">HOLDINGS</p>
              <h2 id="positions-title">持倉明細</h2>
            </div>
            <span id="positions-count" class="muted"></span>
          </div>
          <div id="empty-positions" class="empty-state" hidden>
            <p>目前沒有開放持倉。</p>
          </div>
          <div id="positions-table-wrapper" class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th scope="col">標的</th>
                  <th scope="col" class="number">數量</th>
                  <th scope="col" class="number">平均成本</th>
                  <th scope="col" class="number">現價</th>
                  <th scope="col" class="number">市值</th>
                  <th scope="col" class="number">損益</th>
                  <th scope="col" class="number">報酬率</th>
                  <th scope="col" class="number">權重</th>
                  <th scope="col">標籤</th>
                </tr>
              </thead>
              <tbody id="positions-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
