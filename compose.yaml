services:
  # Cache only: everything here can be refetched from the market provider, so persistence is
  # switched off and the container is disposable. No port is published -- it is reachable only
  # from the compose network, keeping the loopback-only rule intact.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      # Cached bars are recoverable, so evicting the least recently used beats refusing writes.
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  portfolio-manager:
    build:
      context: .
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn portfolio_manager.api:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      PORTFOLIO_DB_PATH: /data/portfolio.db
      PORTFOLIO_QUOTE_TTL_SECONDS: "${PORTFOLIO_QUOTE_TTL_SECONDS:-300}"
      PORTFOLIO_URL_PREFIX: /portfolio
      PORTFOLIO_REDIS_URL: redis://redis:6379/0
      PORTFOLIO_HISTORY_CACHE_TTL_SECONDS: "${PORTFOLIO_HISTORY_CACHE_TTL_SECONDS:-2592000}"
      PORTFOLIO_HISTORY_RECENT_TTL_SECONDS: "${PORTFOLIO_HISTORY_RECENT_TTL_SECONDS:-600}"
    volumes:
      - portfolio-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  portfolio-mcp:
    build:
      context: .
    command: ["portfolio-mcp"]
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      PORTFOLIO_MCP_TRANSPORT: streamable-http
      PORTFOLIO_MCP_HOST: 0.0.0.0
      PORTFOLIO_MCP_PORT: "8002"
      PORTFOLIO_API_BASE_URL: http://portfolio-manager:8001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8002), timeout=2).close()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      portfolio-manager:
        condition: service_healthy
    restart: unless-stopped

  portfolio-snapshot-cron:
    build:
      context: .
    command: ["python", "-m", "portfolio_manager.snapshot_cron"]
    environment:
      PORTFOLIO_API_BASE_URL: http://portfolio-manager:8001
      PORTFOLIO_SNAPSHOT_CRON_HOUR_UTC: "${PORTFOLIO_SNAPSHOT_CRON_HOUR_UTC:-0}"
      PORTFOLIO_SNAPSHOT_LOOKBACK_DAYS: "${PORTFOLIO_SNAPSHOT_LOOKBACK_DAYS:-7}"
    depends_on:
      portfolio-manager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  portfolio-data:
