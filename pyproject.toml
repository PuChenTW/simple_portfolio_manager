[project]
name = "local-portfolio-manager"
version = "0.1.0"
description = "A local, agent-friendly portfolio management API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "mcp>=1.12",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "yfinance>=0.2.65",
]

[project.scripts]
portfolio-manager = "portfolio_manager.__main__:main"
portfolio-mcp = "portfolio_manager.mcp_server:main"

[dependency-groups]
dev = [
    "anyio>=4.0",
    "pytest>=8.4.1",
    "ruff>=0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: tests that call the live Yahoo Finance service"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
